name: Android Miku-Link APK CI

on:
  push:
    paths:
      - 'android/**'
      - 'miku/crates/miku-mobile-core/**'
      - 'miku/crates/miku-protocol/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'miku/crates/miku-mobile-core/**'
  workflow_dispatch:

jobs:
  build-rust-core-and-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Install cargo-ndk and build miku-mobile-core (.so)
        run: |
          cargo install cargo-ndk --locked
          mkdir -p android/app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --manifest-path miku/Cargo.toml -p miku-mobile-core --release

      - name: Run Rust mobile core contract tests
        run: cargo test --manifest-path miku/Cargo.toml -p miku-mobile-core -- --nocapture

      - name: Setup Gradle & run Android unit tests + Debug APK build
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and assemble Android APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: miku-link-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
