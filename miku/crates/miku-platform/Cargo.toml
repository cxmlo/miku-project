[package]
name = "miku-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
miku-protocol = { path = "../miku-protocol" }
miku-core = { path = "../miku-core" }
miku-gateway = { path = "../miku-gateway" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt", "sync", "macros", "time", "net"] }
