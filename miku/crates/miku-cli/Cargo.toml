[package]
name = "miku-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "miku-cli"

[[bin]]
name = "miku-cli"
path = "src/main.rs"

[[bin]]
name = "miku-license-audit"
path = "src/bin/miku_license_audit.rs"

[dependencies]
miku-protocol = { path = "../miku-protocol" }
miku-core = { path = "../miku-core" }
miku-gateway = { path = "../miku-gateway" }
miku-gatekeeper = { path = "../miku-gatekeeper" }
miku-storage = { path = "../miku-storage" }
miku-agent = { path = "../miku-agent" }
miku-platform = { path = "../miku-platform" }
miku-ui = { path = "../miku-ui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.40", features = ["rt", "sync", "macros", "time", "net"] }
