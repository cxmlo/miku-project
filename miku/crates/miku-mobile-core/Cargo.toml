[package]
name = "miku-mobile-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared UniFFI/C-ABI mobile core for Miku-Link Android client (req_hash pinning, biometric gating, pc_only guard, parity matrix)"

[lib]
name = "miku_mobile_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
miku-protocol = { path = "../miku-protocol" }
miku-gatekeeper = { path = "../miku-gatekeeper" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
