[package]
name = "miku-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
miku-protocol = { path = "../miku-protocol" }
miku-core = { path = "../miku-core" }
miku-gatekeeper = { path = "../miku-gatekeeper" }
miku-agent = { path = "../miku-agent" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.40", features = ["net", "io-util", "rt", "sync", "macros", "time", "process"] }
