[package]
name = "miku-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Miku local context engine and working memory: semantic code/Markdown chunker, deterministic token window eviction, stable KV-cache prompt assembler, and Gatekeeper-enforced FTS5 bridge"

[[bin]]
name = "miku-memory"
path = "src/main.rs"

[dependencies]
miku-protocol = { path = "../miku-protocol" }
miku-core = { path = "../miku-core" }
miku-gatekeeper = { path = "../miku-gatekeeper" }
miku-storage = { path = "../miku-storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", default-features = false, features = ["rt", "sync", "time", "macros"] }
