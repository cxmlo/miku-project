[workspace]
resolver = "2"
members = [
    "crates/miku-protocol",
    "crates/miku-core",
    "crates/miku-gateway",
    "crates/miku-gatekeeper",
    "crates/miku-agent",
    "crates/miku-storage",
    "crates/miku-memory",
    "crates/miku-platform",
    "crates/miku-cli",
    "crates/miku-ui",
    "crates/miku-mcp",
    "crates/miku-skills",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Miku Desktop Orchestrator Contributors"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
