<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- Orejitas laterales (en tu código son hand(): elipse 13×24 rotada ±0.5 rad, pivote = centro) · left_ear=[14,81] right_ear=[114,81] · mismo glow que el cuerpo (1 pasada) -->
<defs>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="5.5" result="blur"/>
<feFlood id="glow-color" flood-color="#BDDEFF" flood-opacity="0.6"/>
<feComposite in2="blur" operator="in" result="halo"/>
<feMerge>
<feMergeNode in="halo"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>
<ellipse id="ear_l" cx="14" cy="81" rx="6.5" ry="12" transform="rotate(-28.65 14 81)" fill="#FFFFFF" filter="url(#glow)"/>
<ellipse id="ear_r" cx="114" cy="81" rx="6.5" ry="12" transform="rotate(28.65 114 81)" fill="#FFFFFF" filter="url(#glow)"/>
</svg>
