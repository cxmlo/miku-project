[package]
name = "miku-spike-05-tts"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Spike 0.5: Local offline streaming ES/EN TTS with TTFA <= 250 ms, SHA-256 verification, and TTL RAM recovery"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
