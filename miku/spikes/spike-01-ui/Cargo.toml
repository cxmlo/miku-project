[package]
name = "miku-spike-01-ui"
version = "0.1.0"
edition = "2021"
description = "Spike 0.1 (0.1a + 0.1b): Real child-process tree private memory & 4 UI lifecycle modes benchmark (Win32 + WebView2)"
license = "MIT"

[lib]
name = "miku_spike_01_ui"
path = "src/lib.rs"

[[bin]]
name = "miku-spike-01-ui"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
] }
webview2-com = "0.33"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
