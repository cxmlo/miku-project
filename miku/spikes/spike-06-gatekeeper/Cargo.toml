[package]
name = "spike-06-gatekeeper"
version = "0.1.0"
edition = "2021"
description = "Spike 0.6: Local Gatekeeper deny-by-default, canonical path jail, tamper-evident SHA-256 hash chain, and IPC Gateway (<= 5 ms)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
