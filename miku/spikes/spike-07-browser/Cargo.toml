[package]
name = "spike-07-browser"
version = "0.1.0"
edition = "2021"
description = "Spike 0.7: Direct CDP BrowserDriver & Computer Use (auto-detection, isolated profile, DOM/Input, lightweight capture, download jail)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
